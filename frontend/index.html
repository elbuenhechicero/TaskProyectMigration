<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Sistema de Gestión Profesional</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Configuración de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <h2 class="text-xl font-semibold text-gray-700">Cargando Task Manager...</h2>
            <p class="text-gray-500 mt-2">Inicializando aplicación</p>
        </div>
    </div>

    <!-- Login Container -->
    <div id="loginContainer" class="hidden">
        <!-- El contenido se genera dinámicamente en LoginView -->
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="hidden min-h-screen bg-gray-50">
        <!-- Navigation Sidebar -->
        <nav id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl z-40 transform transition-transform duration-300 ease-in-out">
            <!-- Sidebar content will be generated dynamically -->
        </nav>

        <!-- Mobile Menu Overlay -->
        <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden hidden"></div>

        <!-- Main Content Area -->
        <main id="mainContent" class="lg:ml-64 min-h-screen">
            <!-- Top Header -->
            <header id="topHeader" class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
                <!-- Header content will be generated dynamically -->
            </header>

            <!-- Page Content Container -->
            <div id="pageContent" class="p-6">
                <!-- Dynamic content will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2">
        <!-- Toast notifications will be added here dynamically -->
    </div>

    <!-- Modal Container -->
    <div id="modalContainer">
        <!-- Modals will be rendered here dynamically -->
    </div>

    <!-- Global Error Handler -->
    <div id="globalErrorContainer" class="fixed bottom-4 left-4 z-50">
        <!-- Global errors will be displayed here -->
    </div>

    <!-- Scripts - Load in correct order -->
    
    <!-- Models -->
    <script src="js/models/BaseModel.js"></script>
    <script src="js/models/User.js"></script>
    <script src="js/models/Task.js"></script>
    <script src="js/models/Project.js"></script>

    <!-- Services -->
    <script src="js/services/ApiService.js"></script>
    <script src="js/services/AuthService.js"></script>
    <script src="js/services/TaskService.js"></script>
    <script src="js/services/ProjectService.js"></script>

    <!-- Views -->
    <script src="js/views/BaseView.js"></script>
    <script src="js/views/LoginView.js"></script>
    <script src="js/views/DashboardView.js"></script>
    <script src="js/views/TaskView.js"></script>
    <script src="js/views/ProjectView.js"></script>
    <script src="js/views/ProfileView.js"></script>

    <!-- Controllers -->
    <script src="js/controllers/AppController.js"></script>
    <script src="js/controllers/TaskController.js"></script>
    <script src="js/controllers/ProjectController.js"></script>

    <!-- Utils -->
    <script src="js/utils/Toast.js"></script>
    <script src="js/utils/ValidationHelper.js"></script>
    <script src="js/utils/DateHelper.js"></script>

    <!-- Main App Initialization -->
    <script>
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            if (window.app && typeof window.app.handleGlobalError === 'function') {
                window.app.handleGlobalError(e.error);
            }
        });

        // Unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
            if (window.app && typeof window.app.handleGlobalError === 'function') {
                window.app.handleGlobalError(e.reason);
            }
        });

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading screen after a short delay
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.display = 'none';
                }
                
                // Initialize main app controller
                try {
                    window.app = new AppController();
                    console.log('Task Manager initialized successfully');
                } catch (error) {
                    console.error('Failed to initialize app:', error);
                    // Show basic error message
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-red-50 flex items-center justify-center">
                            <div class="bg-white p-8 rounded-lg shadow-lg max-w-md">
                                <div class="text-center">
                                    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                                    <h1 class="text-xl font-bold text-gray-800 mb-2">Error de Inicialización</h1>
                                    <p class="text-gray-600 mb-4">No se pudo inicializar la aplicación.</p>
                                    <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                        Reintentar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }, 1000);
        });

        // Service Worker registration (opcional)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registered successfully');
                    })
                    .catch(function(registrationError) {
                        console.log('ServiceWorker registration failed: ', registrationError);
                    });
            });
        }
    </script>

    <!-- Performance monitoring (opcional) -->
    <script>
        // Monitor performance metrics
        window.addEventListener('load', function() {
            if ('performance' in window) {
                const perfData = performance.getEntriesByType('navigation')[0];
                console.log('Page load performance:', {
                    domContentLoaded: perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart,
                    loadComplete: perfData.loadEventEnd - perfData.loadEventStart,
                    totalTime: perfData.loadEventEnd - perfData.navigationStart
                });
            }
        });
    </script>
</body>
</html>
