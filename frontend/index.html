<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="antialiased app-body">
  <!-- Pantalla de Login (full screen, centrada) -->
  <div id="loginPanel" class="login-screen">
    <div class="login-screen-bg"></div>
    <div class="login-panel-wrapper"></div>
  </div>

  <!-- App principal: sidebar + contenido -->
  <div id="mainPanel" class="app-layout hidden">
    <!-- Sidebar estilo Discord/Facebook -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        </div>
        <span class="sidebar-title">Task Manager</span>
      </div>
      <nav class="sidebar-nav">
        <button type="button" data-tab="tasks" class="tab-button sidebar-item active">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
          <span>Tareas</span>
        </button>
        <button type="button" data-tab="projects" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          <span>Proyectos</span>
        </button>
        <button type="button" data-tab="comments" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>Comentarios</span>
        </button>
        <button type="button" data-tab="history" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Historial</span>
        </button>
        <button type="button" data-tab="notifications" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>Notificaciones</span>
        </button>
        <button type="button" data-tab="search" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span>Búsqueda</span>
        </button>
        <button type="button" data-tab="reports" class="tab-button sidebar-item">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Reportes</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebarUserAvatar"></div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="sidebarUserName"></span>
            <span class="sidebar-user-status">En línea</span>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="sidebar-logout">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Salir</span>
        </button>
      </div>
    </aside>
    <!-- Área principal: top bar + contenido -->
    <main class="app-main">
      <header class="app-topbar">
        <h1 class="app-topbar-title" id="currentSectionTitle">Tareas</h1>
        <div class="app-topbar-user">
          <div class="topbar-avatar" id="topbarUserAvatar"></div>
          <span class="topbar-username" id="currentUser"></span>
        </div>
      </header>
      <div class="app-content">
        <div id="tabContentContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils/escape.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/services/ApiService.js"></script>
  <script src="js/services/AuthService.js"></script>
  <script src="js/services/ViewLoader.js"></script>
  <script src="js/services/TaskService.js"></script>
  <script src="js/services/ProjectService.js"></script>
  <script src="js/services/CommentService.js"></script>
  <script src="js/services/HistoryService.js"></script>
  <script src="js/services/NotificationService.js"></script>
  <script src="js/services/ReportService.js"></script>
  <script src="js/views/LoginView.js"></script>
  <script src="js/views/TaskView.js"></script>
  <script src="js/views/ProjectView.js"></script>
  <script src="js/views/CommentView.js"></script>
  <script src="js/views/HistoryView.js"></script>
  <script src="js/views/NotificationView.js"></script>
  <script src="js/views/SearchView.js"></script>
  <script src="js/views/ReportView.js"></script>
  <script src="js/controllers/AuthController.js"></script>
  <script src="js/controllers/TabController.js"></script>
  <script src="js/controllers/TaskController.js"></script>
  <script src="js/controllers/ProjectController.js"></script>
  <script src="js/controllers/CommentController.js"></script>
  <script src="js/controllers/HistoryController.js"></script>
  <script src="js/controllers/NotificationController.js"></script>
  <script src="js/controllers/SearchController.js"></script>
  <script src="js/controllers/ReportController.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
