<div id="projectsTab" class="tab-content hidden">
  <h2 class="page-title">Gestión de Proyectos</h2>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <section class="card-muted">
      <h3 class="section-title">Nuevo / Editar Proyecto</h3>
      <form id="projectForm" class="space-y-3">
        <div>
          <label for="projectName" class="block text-sm font-medium text-slate-700">Nombre *</label>
          <input type="text" id="projectName" required class="input w-full">
        </div>
        <div>
          <label for="projectDescription" class="block text-sm font-medium text-slate-700">Descripción</label>
          <textarea id="projectDescription" rows="3" class="input w-full"></textarea>
        </div>
        <div class="flex flex-wrap gap-2">
          <button type="submit" name="add" class="btn btn-primary">Agregar</button>
          <button type="button" name="update" class="btn btn-secondary">Actualizar</button>
          <button type="button" name="delete" class="btn btn-danger">Eliminar</button>
        </div>
      </form>
    </section>
    <section>
      <h3 class="section-title">Lista de Proyectos</h3>
      <div class="table-wrapper">
        <table class="w-full">
          <thead>
            <tr><th>ID</th><th>Nombre</th><th>Descripción</th></tr>
          </thead>
          <tbody id="projectsTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>
