services:
  # Backend API (FastAPI)
  - type: web
    name: taskmanager-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MONGODB_URI
        value: "mongodb+srv://eliose121:rey12116@hechicluster.ee92rpm.mongodb.net/task_manager"
      - key: DATABASE_NAME
        value: "task_manager"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: API_V1_PREFIX
        value: "/api/v1"
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_ORIGINS
        value: '["https://taskmanager-frontend.onrender.com", "http://localhost:3000"]'